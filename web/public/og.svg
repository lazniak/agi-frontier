<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="AGI Frontier — the living chart of flagship AI">
  <defs>
    <radialGradient id="warm" cx="88%" cy="-6%" r="78%">
      <stop offset="0%" stop-color="#F5C400" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#F5C400" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="cool" cx="4%" cy="108%" r="70%">
      <stop offset="0%" stop-color="#111111" stop-opacity="0.07" />
      <stop offset="100%" stop-color="#111111" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#ffffff" />
  <rect width="1200" height="630" fill="url(#warm)" />
  <rect width="1200" height="630" fill="url(#cool)" />

  <!-- future region -->
  <rect x="830" y="150" width="290" height="330" fill="#F5C400" opacity="0.05" />

  <!-- grid -->
  <g stroke="#111111" stroke-opacity="0.07" stroke-width="1">
    <line x1="80" y1="480" x2="1120" y2="480" />
    <line x1="80" y1="397" x2="1120" y2="397" />
    <line x1="80" y1="314" x2="1120" y2="314" />
    <line x1="80" y1="231" x2="1120" y2="231" />
    <line x1="80" y1="150" x2="1120" y2="150" />
  </g>

  <!-- forecast fan -->
  <path d="M830 300 L1120 200 L1120 330 L830 330 Z" fill="#F5C400" opacity="0.14" />
  <path d="M830 315 L1120 262" fill="none" stroke="#F5C400" stroke-width="2.5" stroke-dasharray="9 7" stroke-linecap="round" />
  <circle cx="935" cy="296" r="46" fill="#F5C400" fill-opacity="0.1" stroke="#F5C400" stroke-width="2.5" />
  <circle cx="1068" cy="272" r="26" fill="#F5C400" fill-opacity="0.1" stroke="#F5C400" stroke-width="2.5" opacity="0.7" />

  <!-- lab lines -->
  <path d="M110 452 L268 421 L420 384 L560 350 L700 326 L830 313" fill="none" stroke="#10A37F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M140 462 L300 434 L455 396 L600 358 L742 331 L826 318" fill="none" stroke="#D97757" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M170 470 L330 447 L488 412 L628 376 L768 344 L822 330" fill="none" stroke="#9168C0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M215 476 L372 460 L520 432 L662 402 L790 368" fill="none" stroke="#4D6BFE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8" />

  <g fill="#ffffff" stroke-width="3">
    <circle cx="830" cy="313" r="8" stroke="#10A37F" fill="#10A37F" />
    <circle cx="826" cy="318" r="8" stroke="#D97757" fill="#D97757" />
    <circle cx="822" cy="330" r="8" stroke="#9168C0" fill="#9168C0" />
  </g>

  <!-- now rule -->
  <line x1="830" y1="132" x2="830" y2="500" stroke="#111111" stroke-width="1.5" />
  <circle cx="830" cy="132" r="8" fill="#ffffff" stroke="#111111" stroke-width="2" />

  <!-- type -->
  <g fill="#111111" font-family="Jost, Futura, 'Century Gothic', system-ui, sans-serif">
    <text x="80" y="96" font-size="26" font-weight="300" letter-spacing="9">AGI FRONTIER</text>
    <text x="80" y="574" font-size="38" font-weight="200" letter-spacing="-0.5">The living chart of flagship AI</text>
  </g>
  <text x="1120" y="574" text-anchor="end" fill="#555555" font-family="Jost, Futura, 'Century Gothic', system-ui, sans-serif" font-size="21" font-weight="300" letter-spacing="2">agi.pablogfx.com</text>

  <circle cx="1096" cy="86" r="22" fill="none" stroke="#111111" stroke-width="1.5" />
  <circle cx="1096" cy="86" r="11" fill="none" stroke="#F5C400" stroke-width="1.5" />
  <circle cx="1096" cy="86" r="3.5" fill="#111111" />
</svg>
