# Traffic signal for the research cadence (REDESIGN §12.8). One line per bundle fetch, which is
# one line per page load: the worker folds it into a count of daily unique visitors and truncates
# the file. Pipe-separated because none of the first five fields can contain a pipe.
# $http_x_forwarded_for carries the real client address, set by the host nginx in front of this
# container ($remote_addr here is only the docker bridge gateway).
log_format traffic '$http_x_forwarded_for|$time_iso8601|$request_method|$uri|$status|$http_user_agent';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Everything else stays unlogged, for privacy rather than for tidiness: nginx's default `main`
    # format ends with "$http_x_forwarded_for", so leaving it on would put every visitor's real
    # address into the container's stdout and from there into Docker's json log, indefinitely.
    # The traffic log below is the one exception, and the worker empties it every hour.
    # (Errors still reach stderr — error_log is set at main level and is not touched here.)
    access_log off;

    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Live data bundle from the worker (mounted volume). Short cache: the worker runs hourly.
    location = /latest.json {
        alias /data/public/latest.json;
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
        # The worker mounts this file read-write at /logs/traffic.log and truncates it after each
        # ingest; nginx holds it O_APPEND, so writes resume at offset 0 (copytruncate).
        access_log /var/log/nginx/traffic.log traffic;
    }

    # Hashed build assets
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
