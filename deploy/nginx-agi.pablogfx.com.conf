# Host nginx site for agi.pablogfx.com → docker web container on 127.0.0.1:3040
# Install: cp to /etc/nginx/sites-available/agi.pablogfx.com.conf, symlink into sites-enabled,
# nginx -t && systemctl reload nginx, then: certbot --nginx -d agi.pablogfx.com
server {
    server_name agi.pablogfx.com;

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 80;
    listen [::]:80;
}
